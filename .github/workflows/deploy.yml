name: Deploy to Vercel (prerendered)

# The prerender step (scripts/prerender.ts) drives a headless Chromium, which
# does NOT run in Vercel's own build sandbox. So we build + prerender here on
# GitHub's Ubuntu runner (where Chromium works) and ship the prebuilt output to
# Vercel. Turn OFF Vercel's own production auto-deploy so it doesn't also build.
#
# Required GitHub repo secrets:
#   VERCEL_TOKEN       - Vercel account token (Vercel → Settings → Tokens)
#   VERCEL_ORG_ID      - team_CoBc7Q76R3ycEmrwGLewJLHb
#   VERCEL_PROJECT_ID  - prj_9eoeIebIE6E5wqIVdTdcbDPA96a8

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (runs build:prerender via vercel.json buildCommand)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
