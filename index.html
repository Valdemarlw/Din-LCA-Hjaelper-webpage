    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="Din LCA Hjælper" />

    <!--
      This shell deliberately declares no page description. Every page sets its
      own via react-helmet-async. A static description tag here was emitted
      first on all 45 pages, so crawlers read one identical sitewide string
      instead of the page-specific one. Verified on the live site 2026-08-11.

      The JSON-LD below is limited to sitewide entities (business, person,
      website). Page-specific types such as BreadcrumbList and FAQPage belong in
      the page component, otherwise every subpage inherits the homepage's
      breadcrumb and FAQ and ships conflicting duplicate entities.

      Note for future audits: keep literal tag markup out of these comments.
      Grep-based checks match inside comments and report phantom duplicates.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": [
            "ProfessionalService",
            "LocalBusiness"
          ],
          "@id": "https://dinlcahjælper.dk/#business",
          "name": "Din LCA Hjælper",
          "description": "Specialiseret i LCA-beregning for byggeri efter BR18. Vi håndterer hele processen fra tidlig fase til myndighedsklar rapport for bolig, erhverv og industri i hele Danmark.",
          "url": "https://dinlcahjælper.dk",
          "logo": "https://xn--dinlcahjlper-edb.dk/brand/logo-square-green-512.png",
          "image": "https://xn--dinlcahjlper-edb.dk/brand/og-image-1200x630.png",
          "sameAs": [
            "https://www.linkedin.com/company/din-lca-hjaelper/"
          ],
          "telephone": "+4529899999",
          "email": "valdemar.wernblad@dinlcahjælper.dk",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "DK"
          },
          "priceRange": "Typisk 5.000-7.000 kr ekskl. moms for enfamiliehuse",
          "areaServed": {
            "@type": "Country",
            "name": "Danmark"
          },
          "founder": {
            "@id": "https://dinlcahjælper.dk/#person"
          },
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "LCA-ydelser",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "LCA Komplet",
                  "description": "Komplet LCA-beregning fra tidlig fase til myndighedsklar rapport efter BR18. Et brugbart struktureret mængdeudtræk kan efter gennemgang og bekræftelse give op til 1.000 kr i afslag."
                },
                "priceSpecification": {
                  "@type": "PriceSpecification",
                  "priceCurrency": "DKK",
                  "minPrice": "5000",
                  "maxPrice": "7000",
                  "valueAddedTaxIncluded": false,
                  "description": "Typisk 5.000-7.000 kr ekskl. moms for et komplet enfamiliehus. Rækkehuse og projekter med flere boliger prissættes manuelt fra 8.000 kr."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Hotspot-analyse",
                  "description": "Identificerer de mest CO₂-tunge bygningsdele"
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Materialeoptimering",
                  "description": "Forslag til alternative materialer hvis CO₂-grænseværdien er i fare"
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "A4/A5-beregning og dokumentation",
                  "description": "Foreløbig A4/A5-beregning med dokumenterede generiske forudsætninger og endelig opdatering med registreret byggepladsforbrug"
                },
                "priceCurrency": "DKK",
                "price": "0",
                "description": "Inkluderet i LCA-beregning"
              }
            ]
          }
        },
        {
          "@type": "Person",
          "@id": "https://dinlcahjælper.dk/#person",
          "name": "Valdemar Løvschal Wernblad",
          "jobTitle": "LCA-rådgiver",
          "worksFor": {
            "@id": "https://dinlcahjælper.dk/#business"
          },
          "knowsAbout": [
            "LCA-beregning",
            "Livscyklusvurdering",
            "BR18",
            "Bæredygtigt byggeri",
            "CO₂-beregning for bygninger",
            "A4 og A5 dokumentation",
            "Miljøpåvirkning fra byggeri"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://dinlcahjælper.dk/#website",
          "name": "Din LCA Hjælper",
          "url": "https://dinlcahjælper.dk",
          "inLanguage": "da",
          "publisher": {
            "@id": "https://dinlcahjælper.dk/#business"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
