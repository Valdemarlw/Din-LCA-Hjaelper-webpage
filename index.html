              "@type": "Question",
              "name": "Hvad er en LCA-beregning?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "En LCA-beregning (livscyklusvurdering) opgør et byggeris samlede miljøpåvirkning over hele dets levetid, fra materialeproduktion til nedrivning. Beregningen er lovpligtig efter BR18 og dokumenterer bl.a. CO₂-udledning pr. m² pr. år. Resultatet afleveres som en rapport til kommunen sammen med færdigmeldingen."

              "@type": "Question",
              "name": "Hvornår er LCA-beregning lovpligtigt?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Alle nye opvarmede byggerier skal have en LCA-beregning uanset størrelse. For uopvarmede bygninger gælder kravet ved arealer over 50 m², og for tilbygninger over 250 m². Kravet følger af BR18 og skal dokumenteres ved færdigmelding for at opnå ibrugtagningstilladelse."

            },

              "@type": "Question",
              "name": "Hvad koster en LCA-beregning?",
              "acceptedAnswer": {
                "@type": "Answer",

            },

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A4 dækker transport af materialer til byggepladsen, og A5 dækker spild, affald og energiforbrug under opførelsen. Tidligt beregner vi begge med dokumenterede generiske forudsætninger. Efter byggeriet opdaterer vi A5 med det registrerede el-, varme-, gas- og brændstofforbrug fra byggepladsen samt de endelige projektoplysninger."
              }
            },

              "@type": "Question",
              "name": "Hvad er grænseværdien for CO₂ i BR18?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Fra 1. juli 2025 gælder differentierede grænseværdier afhængigt af bygningstype: sommerhuse under 150 m² skal holde 4,0 kg CO₂e/m²/år, enfamiliehuse og rækkehuse 6,7, etageboliger og kontor 7,5, og øvrigt nybyggeri 8,0. Derudover er der en separat grænse for byggeprocessen (A4+A5) på 1,5 kg CO₂e/m²/år for alle typer."
              }
            },

              "@type": "Question",
              "name": "Kan I hjælpe med både bolig og erhverv?",
